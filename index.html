    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }

        #canvas-container {

            background-color: #121212;

        .element-node { position: absolute; cursor: grab; user-select: none; box-sizing: border-box; transition: box-shadow 0.1s; }
        .element-node:active { cursor: grabbing; }
        
        .element-node.selected:not(.window-node) {

            box-shadow: 0 0 15px rgba(255, 191, 0, 0.4); z-index: 1000 !important;

        .resize-handle { position: absolute; width: 8px; height: 8px; background: #FFBF00; border: 1px solid #1A0B00; border-radius: 50%; z-index: 1001; }
        .resize-nw { top: -4px; left: -4px; cursor: nwse-resize; }
        .resize-n  { top: -4px; left: calc(50% - 4px); cursor: ns-resize; }
        .resize-ne { top: -4px; right: -4px; cursor: nesw-resize; }
        .resize-e  { top: calc(50% - 4px); right: -4px; cursor: ew-resize; }
        .resize-se { bottom: -4px; right: -4px; cursor: nwse-resize; }
        .resize-s  { bottom: -4px; left: calc(50% - 4px); cursor: ns-resize; }
        .resize-sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
        .resize-w  { top: calc(50% - 4px); left: -4px; cursor: ew-resize; }

        .tree-item { cursor: pointer; border: 1px solid transparent; }
        .tree-item.drag-over { border-top: 2px solid #FFBF00; background: rgba(255,191,0,0.1); }
        .ctx-item { padding: 8px 12px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2D2D2D; transition: background 0.1s; }
        .ctx-item:hover { background: #2D2D2D; }
        .ctx-item:last-child { border-bottom: none; }
        .accordion-content { display: none; }
        .accordion-content.open { display: grid; }
        .visual-block { background: linear-gradient(180deg, #374151 0%, #1f2937 100%); border-left: 4px solid #E58A00; }
        
        .modal { display: none; }
        .modal.active { display: flex; }

        function parseBursztynColor(bHex) {
            let clean = (bHex||'').toString().replace('0x', '');
            while(clean.length < 8) clean = '0' + clean;
            let a = parseInt(clean.substring(0,2), 16);
            let hex = '#' + clean.substring(2);
            return { a, hex };
        }

        function buildBursztynColor(a, hex) {
            let aStr = parseInt(a).toString(16).toUpperCase().padStart(2, '0');
            let hStr = hex.replace('#', '').toUpperCase();
            return '0x' + aStr + hStr;
        }

        function bursztynToRGBA(bHex) {
            let { a, hex } = parseBursztynColor(bHex);
            let r = parseInt(hex.substring(1,3), 16) || 0;
            let g = parseInt(hex.substring(3,5), 16) || 0;
            let b = parseInt(hex.substring(5,7), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${a / 255.0})`;
        }

        function addElement(type, x=100, y=100, w=120, h=30, text="") {
            const id = elementIdCounter++;
            let zIndex = elements.length;
            let el = { id, type, x, y, w, h, z: zIndex, name: `${type}_${id}`, onClick: '', visualEvents: [], eventMode: 'visual' };

            if (type === 'window') { el.text = text || "Aplikacja Bursztyn"; el.bg = OS_COLORS.CarbonBg; } 
            else if (type === 'TPanel' || type.includes('Grid') || type === 'TGroupBox' || type === 'TRadioGroup') { el.bg = OS_COLORS.CarbonPanel; el.color = OS_COLORS.CarbonBorder; el.text = text; } 
            else if (type === 'TButton' || type === 'TBitBtn') { el.bg = OS_COLORS.CarbonPanel; el.color = OS_COLORS.White; el.text = text; } 
            else if (type === 'TLabel' || type === 'TCheckBox' || type === 'TRadioButton') { el.bg = OS_COLORS.Transparent; el.color = OS_COLORS.White; el.scale = 1; el.text = text; } 
            else if (type === 'TListBox' || type === 'TMemo' || type === 'TEdit' || type === 'TComboBox' || type === 'TCheckListBox') { el.bg = OS_COLORS.White; el.color = OS_COLORS.Black; el.text = text; }
            else if (type === 'TProgressBar') { el.bg = OS_COLORS.CarbonPanel; el.color = OS_COLORS.AccentBlue; el.value = 50; }
            else if (type === 'TShape') { el.bg = OS_COLORS.AccentBlue; }
            else if (type === 'TStatusBar') { el.bg = OS_COLORS.CarbonPanel; el.color = OS_COLORS.White; el.text = 'Gotowy.'; }
            else { el.bg = OS_COLORS.CarbonPanel; el.color = OS_COLORS.White; el.text = text; } 

            elements.push(el); selectElement(id); updateUI();
        }

        function deleteSelected() {
            if (!selectedId) return;
            const el = elements.find(e => e.id === selectedId);
            if (el) { deletedElements.push({...el}); elements = elements.filter(e => e.id !== selectedId); selectedId = null; updateUI(); }
        }

        function clearCanvas() { elements = []; deletedElements = []; selectedId = null; updateUI(); }
        function selectElement(id) { selectedId = id; updateUI(); }

        window.updateElementProp = function(id, prop, value) {
            const el = elements.find(e => e.id === id);
            if (el) {
                if (['x', 'y', 'w', 'h', 'z', 'scale', 'value'].includes(prop)) el[prop] = parseInt(value) || 0;
                else el[prop] = value;
                if (prop === 'z') { elements.sort((a,b) => a.z - b.z); elements.forEach((e, idx) => e.z = idx); }
                updateUI();
            }
        }

        window.updateColor = function(prop, hex, alpha) {
            if (selectedId) updateElementProp(selectedId, prop, buildBursztynColor(alpha, hex));
        };

        function saveJSON() {
            const data = JSON.stringify(elements, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'projekt_bursztyn.json';
            a.click(); URL.revokeObjectURL(url);
        }

        function loadJSON(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (Array.isArray(parsed)) {
                        elements = parsed;
                        let maxId = 0; elements.forEach(el => { 
                            if(el.id > maxId) maxId = el.id; 
                            if(!el.visualEvents) el.visualEvents = [];
                            if(!el.eventMode) el.eventMode = 'visual';
                            if(el.onClick === undefined) el.onClick = '';
                        });
                        elementIdCounter = maxId + 1; deletedElements = []; selectedId = null; updateUI();
                    }
                } catch(err) { alert("Błąd wczytywania pliku JSON! Upewnij się, że to poprawny plik projektu Bursztyn."); }
            };
            reader.readAsText(file); e.target.value = ''; 
        }

        function openVisualModal(id) {
            activeVisualTargetId = id;
            const el = elements.find(e => e.id === id);
            document.getElementById('visual-modal-target-name').innerText = `Komponent: ${el.name} (${el.type})`;
            tempVisualEvents = JSON.parse(JSON.stringify(el.visualEvents || []));
            renderVisualWorkspace(); document.getElementById('visual-modal').classList.add('active');
        }
        function closeVisualModal() { document.getElementById('visual-modal').classList.remove('active'); activeVisualTargetId = null; }
        
        function saveVisualModal() {

        window.removeTempVisualEvent = function(evIndex) { tempVisualEvents.splice(evIndex, 1); renderVisualWorkspace(); }

        function renderVisualWorkspace() {

            tempVisualEvents.forEach((ev, idx) => {

                html += `<div class="bg-carbon-800 border border-carbon-700 rounded p-3 mb-2"><div class="flex justify-between items-center mb-2"><span class="text-sm font-bold text-bursztyn-400 flex items-center gap-2"><span class="text-xl">${def.icon}</span> ${def.name}</span><button onclick="removeTempVisualEvent(${idx})" class="bg-red-900/80 hover:bg-red-800 px-2 py-0.5 rounded text-xs text-white">Usuń</button></div><div class="flex flex-col gap-2">`;

                    html += `<div class="flex items-center gap-3"><label class="text-xs text-gray-400 w-32 text-right">${p.label}</label><input type="${p.type}" value="${val}" onchange="updateTempVisualParam(${idx}, '${p.name}', this.value)" class="flex-1 bg-carbon-950 border border-carbon-700 text-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-bursztyn-500 font-mono"></div>`;

        function openMonacoModal() {
            document.getElementById('code-modal').classList.add('active');

            if (!monacoInst) {
                require(['vs/editor/editor.main'], function () {

        window.setEventMode = function(mode) {
            if(!selectedId) return;
            const el = elements.find(e => e.id === selectedId); el.eventMode = mode;
            if(mode === 'visual') syncVisualToCode(el); updateUI();
        }

        // Escapuje tekst tak, by bezpiecznie trafil do literalu C++ ("...").
        // Wczesniej teksty z cudzyslowami / backslashami / nowymi liniami
        // (np. wielolinijkowy TMemo) łamały wygenerowany kod.
        function escapeCppString(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '\\"')
                .replace(/\r\n/g, '\\n')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\n')
                .replace(/\t/g, '\\t');
        }

        // Tworzy unikalny, poprawny identyfikator C++ z nazwy nadanej przez
        // uzytkownika (usuwa polskie znaki/spacje/znaki specjalne, dokleja
        // id elementu, zeby uniknac kolizji przy duplikatach nazw).
        function cIdent(el) {
            let base = (el.name || el.type || 'obj').toString();
            const map = {'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z',
                         'Ą':'A','Ć':'C','Ę':'E','Ł':'L','Ń':'N','Ó':'O','Ś':'S','Ź':'Z','Ż':'Z'};
            base = base.replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, ch => map[ch] || ch);
            base = base.replace(/[^a-zA-Z0-9_]/g, '_');
            if (!/^[a-zA-Z_]/.test(base)) base = '_' + base;
            return `${base}_${el.id}`;
        }

        function syncVisualToCode(el) {
            let code = '';
            el.visualEvents.forEach(ev => {
                if(ev.type === 'print') code += `bws_wywolaj(1, (uint64_t)"${escapeCppString(ev.params.text)}\\n");\n`;
                else if(ev.type === 'exec') code += `bws_wywolaj(10, (uint64_t)"${escapeCppString(ev.params.path)}");\n`;
                else if(ev.type === 'sound') code += `bws_wywolaj(27, ${parseInt(ev.params.hz)||440}, ${parseInt(ev.params.ms)||200});\n`;
                else if(ev.type === 'exit') code += `bws_wywolaj(32); while(1);\n`;
                else if(ev.type === 'raw') code += `${ev.params.code}\n`;
            });
            el.onClick = code;
        }

        function renderProperties() {
            if (!selectedId) { propertiesPanel.innerHTML = '<div class="text-gray-600 text-center mt-10 text-xs">Wybierz komponent z płótna.</div>'; return; }
            const el = elements.find(e => e.id === selectedId); if (!el) return;

            let html = `<div class="mb-3 border-b border-carbon-800 pb-2"><input type="text" value="${el.name}" onchange="updateElementProp(${selectedId}, 'name', this.value)" class="w-full bg-transparent text-bursztyn-400 font-bold text-sm focus:outline-none border-b border-transparent focus:border-bursztyn-500"><div class="text-[10px] text-gray-500 mt-1">Typ: ${el.type}</div></div>`;
            html += `<div class="grid grid-cols-2 gap-2 mb-3">`;
            html += createInputGroup('Poz X', 'x', el.x, 'number'); html += createInputGroup('Poz Y', 'y', el.y, 'number');
            html += createInputGroup('Szer (W)', 'w', el.w, 'number'); html += createInputGroup('Wys (H)', 'h', el.h, 'number');
            html += `</div>`; html += createInputGroup('Z-Order', 'z', el.z, 'number') + `<div class="mb-3"></div>`;

            if (['TComboBox', 'TListBox', 'TCheckListBox', 'TRadioGroup', 'TMainMenu', 'TPopupMenu'].includes(el.type)) {
                html += createInputGroup('Elementy listy/menu (po jednym w linii)', 'text', el.text, 'textarea') + `<div class="mb-3"></div>`;

                html += createInputGroup('Zawartość / Tekst', 'text', el.text, 'text') + `<div class="mb-3"></div>`;
            }

            if (el.bg !== undefined) html += createColorControl('KOLOR TŁA (BG)', 'bg', el.bg);
            if (el.color !== undefined) html += createColorControl('KOLOR TEKSTU (FG)', 'color', el.color);

            // Sekcja zdarzen dostepna teraz dla wszystkich komponentow
            // interaktywnych, a nie tylko przyciskow.
            if (EVENTOWALNE_TYPY.includes(el.type)) {
                html += `<div class="mt-5 border-t border-carbon-800 pt-3"><div class="flex justify-between items-center mb-2"><h3 class="text-[10px] font-bold text-bursztyn-500 uppercase tracking-widest">⚡ Zdarzenia (Click / Interakcja)</h3></div>`;
                if (el.eventMode === 'visual') {
                    html += `<div class="bg-carbon-950 border border-carbon-700 rounded p-2 text-center mb-2 text-[10px] text-gray-400">Akcje blokowe: ${el.visualEvents.length}</div><button onclick="openVisualModal(${el.id})" class="w-full bg-bursztyn-600 hover:bg-bursztyn-500 text-white py-1.5 rounded text-xs font-bold transition-colors">🧩 Otwórz Edytor Wizualny</button>`;
                } else {
                    html += `<textarea onchange="updateElementProp(${selectedId}, 'onClick', this.value)" class="w-full bg-carbon-950 border border-carbon-700 text-gray-300 rounded p-2 text-[10px] h-24 font-mono custom-scrollbar">${el.onClick || ''}</textarea>`;
                }
                html += `<div class="flex gap-2 mt-2"><button onclick="setEventMode('visual')" class="flex-1 text-[9px] py-1 bg-carbon-800 text-white rounded">Visual</button><button onclick="setEventMode('code')" class="flex-1 text-[9px] py-1 bg-carbon-800 text-white rounded">C++</button></div>`;
                if (el.type === 'TComboBox') {
                    html += `<div class="text-[9px] text-gray-500 mt-2 italic">Rozwijanie listy i wybór pozycji są generowane automatycznie — powyższy kod uruchomi się dodatkowo po zmianie wyboru.</div>`;
                } else if (el.type === 'TCheckBox' || el.type === 'TRadioButton') {
                    html += `<div class="text-[9px] text-gray-500 mt-2 italic">Przełączanie zaznaczenia jest generowane automatycznie — powyższy kod uruchomi się dodatkowo po kliknięciu.</div>`;
                }
                html += `</div>`;
            }
            propertiesPanel.innerHTML = html;
        }

        function createInputGroup(label, prop, value, type) {
            let extra = type === 'textarea' ? `<textarea onchange="updateElementProp(${selectedId}, '${prop}', this.value)" class="w-full bg-carbon-800 border border-carbon-700 text-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-bursztyn-500 h-24 font-mono custom-scrollbar" placeholder="Element 1\nElement 2...">${value || ''}</textarea>` : `<input type="${type}" value="${value}" onchange="updateElementProp(${selectedId}, '${prop}', this.value)" class="w-full bg-carbon-800 border border-carbon-700 text-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-bursztyn-500">`;

                    items.forEach(item => {
                        cppCode += `    gui_wypisz_tekst_kolor_skala(WIN_X + ${relX} + ${currentX}, WIN_Y + ${relY} + 4, ${el.color}, 1, "${escapeCppString(item)}");\n`;
                        currentX += item.length * 8 + 15;
                    });
                }
                else {
                    cppCode += `    gui_rysuj_prostokat(WIN_X + ${relX}, WIN_Y + ${relY}, ${el.w}, ${el.h}, 0x00444444);\n`;
                    cppCode += `    rysuj_tekst_wysrodkowany(WIN_X + ${relX}, WIN_Y + ${relY}, ${el.w}, ${el.h}, 1, 0x00FFFFFF, "${el.type}");\n`;
                }
            });

            cppCode += `\n    gui_odswiez();\n}\n\n`;

            cppCode += `extern "C" __attribute__((noreturn)) void _start() {\n`;
            cppCode += `    gui_pobierz_rozdzielczosc(&screen_w, &screen_h);\n`;
            cppCode += `    if (screen_w <= 0 || screen_h <= 0) gui_zakoncz_aplikacje();\n`;
            cppCode += `    ogranicz_pozycje_okna(&WIN_X, &WIN_Y);\n`;
            cppCode += `    if (bws_utworz_warstwe(WIN_X, WIN_Y, WIN_W, WIN_H, 10) < 0) gui_zakoncz_aplikacje();\n`;
            cppCode += `    gui_ustaw_przejecie_myszy(true);\n`;
            cppCode += `    bool wyjdz = false;\n`;
            cppCode += `    RysujInterfejs(true);\n\n`;
            cppCode += `    while (!wyjdz) {\n`;
            cppCode += `        bws_zdarzenie zdarzenie{};\n`;
            cppCode += `        if (!gui_czekaj_na_zdarzenie(&zdarzenie)) continue;\n`;
            cppCode += `        if (zdarzenie.typ == BWS_ZDARZENIE_FOCUS && aplikacja_zminimalizowana) aplikacja_zminimalizowana = false;\n`;
            cppCode += `        const int mx = zdarzenie.x; const int my = zdarzenie.y;\n`;
            cppCode += `        const bool lewy = (zdarzenie.przyciski & 0x01U) != 0;\n`;
            cppCode += `        const bool klik_lewy = zdarzenie.typ == BWS_ZDARZENIE_MYSZ_DOWN;\n`;
            cppCode += `        const bool puszczenie_lewego = zdarzenie.typ == BWS_ZDARZENIE_MYSZ_UP;\n`;
            cppCode += `        bool redraw = false; bool pelne_czyszczenie = false;\n\n`;
            cppCode += `        if (aplikacja_zminimalizowana) continue;\n\n`;

            // Poprawka: zamykanie otwartego comboboxa przy kliknieciu gdziekolwiek
            // indziej (tak, by rozwiniete listy nie zostawaly "zawieszone" na ekranie).
            const combos = sortedElements.filter(e => e.type === 'TComboBox' || e.type === 'TDBComboBox');
            if (combos.length > 0) {
                cppCode += `        // Klikniecie w pozycje rozwinietej listy ComboBox (obsluga PRZED reszta trafien,\n`;
                cppCode += `        // bo lista rysuje sie NAD innymi kontrolkami).\n`;
                cppCode += `        bool combo_klik_obsluzony = false;\n`;
                cppCode += `        if (klik_lewy) {\n`;
                combos.forEach(el => {
                    const id = cIdent(el);
                    const items = (el.text||"").split('\n').filter(i => i.trim() !== '');
                    let relX = windowEl ? el.x - windowEl.x : el.x;
                    let relY = windowEl ? el.y - windowEl.y : el.y;
                    cppCode += `            if (combo_otwarty_${id}) {\n`;
                    cppCode += `                const int n_${id} = ${Math.max(items.length,1)};\n`;
                    cppCode += `                if (punkt_w_prostokacie(mx, my, WIN_X + ${relX}, WIN_Y + ${relY} + ${el.h}, ${el.w}, n_${id} * 16)) {\n`;
                    cppCode += `                    int wybrany_${id} = (my - (WIN_Y + ${relY} + ${el.h})) / 16;\n`;
                    cppCode += `                    if (wybrany_${id} >= 0 && wybrany_${id} < n_${id}) combo_wybor_${id} = wybrany_${id};\n`;
                    cppCode += `                    combo_otwarty_${id} = false; redraw = true; pelne_czyszczenie = true; combo_klik_obsluzony = true;\n`;
                    if (el.onClick && el.onClick.trim() !== '') {
                        cppCode += `                    // zdarzenie uzytkownika po zmianie wyboru\n`;
                        el.onClick.split('\n').forEach(l => { if (l.trim() !== '') cppCode += `                    ${l}\n`; });
                    }
                    cppCode += `                } else if (punkt_w_prostokacie(mx, my, WIN_X + ${relX}, WIN_Y + ${relY}, ${el.w}, ${el.h})) {\n`;
                    cppCode += `                    combo_otwarty_${id} = false; redraw = true; pelne_czyszczenie = true; combo_klik_obsluzony = true;\n`;
                    cppCode += `                } else {\n`;
                    cppCode += `                    combo_otwarty_${id} = false; redraw = true; pelne_czyszczenie = true;\n`;
                    cppCode += `                }\n`;
                    cppCode += `            }\n`;
                });
                cppCode += `        }\n\n`;
            } else {
                cppCode += `        bool combo_klik_obsluzony = false;\n\n`;
            }

            cppCode += `        if (!combo_klik_obsluzony && klik_lewy && punkt_w_prostokacie(mx, my, WIN_X, WIN_Y, WIN_W, WIN_H)) {\n`;

            if (windowEl) {
                cppCode += `            const gui_akcja_belki akcja = gui_hit_test_belki(mx, my, WIN_X, WIN_Y, WIN_W);\n`;
                cppCode += `            if (akcja == GUI_BELKA_MINIMALIZUJ) {\n`;
                cppCode += `                aplikacja_zminimalizowana = gui_minimalizuj_okno();\n`;
                cppCode += `                dragging = false; gui_ustaw_capture_myszy(false);\n`;
                cppCode += `            } else if (akcja == GUI_BELKA_ZAMKNIJ) {\n`;
                cppCode += `                wyjdz = true; dragging = false;\n`;
                cppCode += `            } else if (akcja == GUI_BELKA_MAKSYMALIZUJ) {\n`;
                cppCode += `                if (!zmaksymalizowane) {\n`;
                cppCode += `                    restore_x = WIN_X; restore_y = WIN_Y; restore_w = WIN_W; restore_h = WIN_H;\n`;
                cppCode += `                    WIN_X = 0; WIN_Y = 0; WIN_W = screen_w; WIN_H = screen_h - 40;\n`;
                cppCode += `                    zmaksymalizowane = true;\n`;
                cppCode += `                } else {\n`;
                cppCode += `                    WIN_X = restore_x; WIN_Y = restore_y; WIN_W = restore_w; WIN_H = restore_h;\n`;
                cppCode += `                    zmaksymalizowane = false;\n`;
                cppCode += `                }\n`;
                cppCode += `                if (bws_utworz_warstwe(WIN_X, WIN_Y, WIN_W, WIN_H, 10) < 0) gui_zakoncz_aplikacje();\n`;
                cppCode += `                redraw = true; pelne_czyszczenie = true;\n`;
                cppCode += `            } else if (akcja == GUI_BELKA_DRAG && !zmaksymalizowane) {\n`;
                cppCode += `                dragging = true; gui_ustaw_capture_myszy(true);\n`;
                cppCode += `                drag_off_x = mx - WIN_X; drag_off_y = my - WIN_Y;\n`;
                cppCode += `            } else {\n`;
            }

            // Poprawka: hit-test przechodzi teraz od najwyzszego elementu (najwyzszy
            // z-order) do najnizszego i PRZERYWA po pierwszym trafieniu, zeby
            // klikniecie nie uruchamialo jednoczesnie kilku nakladajacych sie
            // kontrolek (np. przycisku lezacego na panelu).
            const hitOrder = [...sortedElements].filter(el => !isNonVisual(el.type)).reverse();
            let firstHit = true;
            hitOrder.forEach(el => {
                const id = cIdent(el);
                let relX = windowEl ? el.x - windowEl.x : el.x;
                let relY = windowEl ? el.y - windowEl.y : el.y;
                const hasCustom = el.onClick && el.onClick.trim() !== '';
                const isEventable = EVENTOWALNE_TYPY.includes(el.type);
                if (!hasCustom && !isEventable) return;

                cppCode += `                ${firstHit ? '' : 'else '}if (punkt_w_prostokacie(mx, my, WIN_X + ${relX}, WIN_Y + ${relY}, ${el.w}, ${el.h})) {\n`;
                firstHit = false;

                if (el.type === 'TCheckBox' || el.type === 'TDBCheckBox') {
                    cppCode += `                    zaznaczone_${id} = !zaznaczone_${id};\n`;
                } else if (el.type === 'TRadioButton') {
                    cppCode += `                    wybrane_${id} = !wybrane_${id};\n`;
                } else if (el.type === 'TListBox') {
                    const items = (el.text||"").split('\n').filter(i => i.trim() !== '');
                    cppCode += `                    { int rel_y_${id} = my - (WIN_Y + ${relY}); int nowy_wybor_${id} = rel_y_${id} / 16; if (nowy_wybor_${id} >= 0 && nowy_wybor_${id} < ${Math.max(items.length,1)}) wybor_${id} = nowy_wybor_${id}; }\n`;
                } else if (el.type === 'TCheckListBox') {
                    cppCode += `                    zaznaczone_${id} = !zaznaczone_${id};\n`;
                } else if (el.type === 'TComboBox' || el.type === 'TDBComboBox') {
                    cppCode += `                    combo_otwarty_${id} = !combo_otwarty_${id};\n`;
                }

                if (hasCustom) {
                    el.onClick.split('\n').forEach(l => { if (l.trim() !== '') cppCode += `                    ${l}\n`; });
                }
                cppCode += `                    redraw = true; pelne_czyszczenie = true;\n                }\n`;
            });

            if(windowEl) cppCode += `            }\n`;
            cppCode += `        }\n\n`;
            cppCode += `        if (dragging && lewy) {\n`;
            cppCode += `            int nowy_x = mx - drag_off_x; int nowy_y = my - drag_off_y;\n`;
            cppCode += `            ogranicz_pozycje_okna(&nowy_x, &nowy_y);\n`;
            cppCode += `            if (nowy_x != WIN_X || nowy_y != WIN_Y) { WIN_X = nowy_x; WIN_Y = nowy_y; bws_przesun_warstwe(WIN_X, WIN_Y); gui_odswiez(); }\n`;
            cppCode += `        }\n`;
            cppCode += `        if (puszczenie_lewego && dragging) { dragging = false; gui_ustaw_capture_myszy(false); }\n`;
            cppCode += `        if (redraw && !wyjdz) RysujInterfejs(pelne_czyszczenie);\n`;
            cppCode += `    }\n`;
            cppCode += `    gui_zakoncz_aplikacje();\n}\n`;

            return cppCode;
        }

        function downloadCPP() {
            const cppCode = generateCPPCode();
            const blob = new Blob([cppCode], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'aplikacja_vcl.cpp';
            a.click(); URL.revokeObjectURL(url);
        }
    </script>
